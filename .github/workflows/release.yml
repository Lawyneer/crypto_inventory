name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: crypto_inventory_windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: crypto_inventory_macos_arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: crypto_inventory_macos_intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/crypto_inventory${{ runner.os == 'Windows' && '.exe' || '' }} ${{ matrix.artifact }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}